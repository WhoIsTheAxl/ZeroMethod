name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Dependency-free core tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile project modules and tests
        run: python -m compileall -q zeromethod tests
      - name: Run dependency-free adapter tests
        run: python -m unittest discover -s tests -p "test_adapter.py" -v
      - name: Run environment factory tests
        run: python -m unittest discover -s tests -p "test_factory.py" -v
      - name: Run episode initialization tests
        run: python -m unittest discover -s tests -p "test_episode.py" -v
      - name: Run episode runner tests
        run: python -m unittest discover -s tests -p "test_runner.py" -v
      - name: Run random baseline tests
        run: python -m unittest discover -s tests -p "test_random_baseline.py" -v
      - name: Run random baseline v2 tests
        run: python -m unittest discover -s tests -p "test_random_baseline_v2.py" -v
      - name: Run final baseline v3 tests
        run: python -m unittest discover -s tests -p "test_greedy_baseline_v3.py" -v
      - name: Run action-interface tests
        run: python -m unittest discover -s tests -p "test_actions.py" -v
      - name: Run state-generation tests
        run: python -m unittest discover -s tests -p "test_state_generation.py" -v
      - name: Run cube-state legality tests
        run: python -m unittest discover -s tests -p "test_state_legality.py" -v

  environment-tests:
    name: Upstream environment tests (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install environment runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.23.5 numba==0.57.1 pygame==2.5.2 Pillow==10.0.1 scipy==1.10.1 gym==0.25.2
      - name: Compile project modules and tests
        run: python -m compileall -q zeromethod tests
      - name: Run upstream environment tests
        env:
          PYTHONPATH: third_party/GymRubiksCube
        run: python -m unittest discover -s tests -p "test_environment.py" -v
      - name: Run seeded episode initialization integration tests
        env:
          PYTHONPATH: third_party/GymRubiksCube
        run: python -m unittest discover -s tests -p "test_episode_integration.py" -v
      - name: Smoke-test random baseline against upstream environment
        env:
          PYTHONPATH: third_party/GymRubiksCube
        run: python -m zeromethod.experiments.random_baseline --episodes 2 --depth 3 --max-agent-steps 10 --seed 42
      - name: Smoke-test random baseline v2 against upstream environment
        env:
          PYTHONPATH: third_party/GymRubiksCube
        run: python -m zeromethod.experiments.random_baseline_v2 --episodes 2 --depth 3 --max-agent-steps 10 --seed 42
      - name: Smoke-test final baseline v3 against upstream environment
        env:
          PYTHONPATH: third_party/GymRubiksCube
        run: python -m zeromethod.experiments.greedy_baseline_v3 --episodes 2 --depth 3 --max-agent-steps 10 --seed 42
