name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-tests:
    name: Environment tests (Python 3.8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Install compatible environment dependencies
        run: |
          python -m pip install --upgrade "setuptools<58" wheel
          python -m pip install \
            numpy==1.20.3 \
            numba==0.54.0 \
            pygame==2.0.1 \
            Pillow==7.0.0 \
            scipy==1.7.1 \
            gym==0.20.0

      - name: Compile project tests
        run: python -m compileall -q tests

      - name: Run environment test suite
        env:
          PYTHONPATH: third_party/GymRubiksCube
        run: python -m unittest discover -s tests -v
